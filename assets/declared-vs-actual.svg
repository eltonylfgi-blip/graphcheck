<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Your graph is not your run</title>
  <desc id="desc">A declared workflow graph compared with an actual execution trace containing an undeclared transition and a skipped verifier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a0f"/>
      <stop offset="0.52" stop-color="#08090d"/>
      <stop offset="1" stop-color="#0d070b"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087aa8"/>
      <stop offset="0.5" stop-color="#24c8ff"/>
      <stop offset="1" stop-color="#087aa8"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a10d32"/>
      <stop offset="0.55" stop-color="#ff315d"/>
      <stop offset="1" stop-color="#ff7b37"/>
    </linearGradient>
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1486ad" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#microGrid)"/>
      <path d="M120 0H0V120" fill="none" stroke="#1fc9ff" stroke-opacity="0.10" stroke-width="1.5"/>
    </pattern>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#24c8ff"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#ff315d"/>
    </marker>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <rect width="1672" height="941" fill="url(#majorGrid)"/>
  <path d="M28 71V28H71 M1601 28H1644V71 M28 870V913H71 M1601 913H1644V870" fill="none" stroke="#26c9ff" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="18" y="18" width="1636" height="905" rx="10" fill="none" stroke="#179ac7" stroke-opacity="0.45" stroke-width="2"/>

  <g filter="url(#shadow)">
    <text x="62" y="110" fill="#f4f7f8" font-family="Impact, Arial Black, sans-serif" font-size="76" letter-spacing="2">YOUR GRAPH IS NOT</text>
    <text x="62" y="206" fill="#ff315d" font-family="Impact, Arial Black, sans-serif" font-size="104" letter-spacing="2" filter="url(#glowRed)">YOUR RUN</text>
  </g>
  <text x="1608" y="96" text-anchor="end" fill="#75dfff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">DECLARED VS ACTUAL</text>
  <text x="1608" y="137" text-anchor="end" fill="#a7b3ba" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="1.5">COMPARE THE PATH WITH WHAT EXECUTED</text>
  <line x1="994" y1="166" x2="1608" y2="166" stroke="url(#cyanLine)" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="62" y="258" width="718" height="488" rx="22" fill="#07141d" fill-opacity="0.90" stroke="#24c8ff" stroke-width="3"/>
    <rect x="892" y="258" width="718" height="488" rx="22" fill="#17080e" fill-opacity="0.88" stroke="#ff315d" stroke-width="3"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="91" y="282" width="243" height="48" rx="24" fill="#0b3447" stroke="#24c8ff" stroke-width="2"/>
    <circle cx="120" cy="306" r="8" fill="#24c8ff" filter="url(#glowCyan)"/>
    <text x="143" y="315" fill="#e8f8ff" font-size="23" font-weight="800" letter-spacing="2">DECLARED GRAPH</text>

    <rect x="921" y="282" width="214" height="48" rx="24" fill="#43101f" stroke="#ff315d" stroke-width="2"/>
    <circle cx="950" cy="306" r="8" fill="#ff315d" filter="url(#glowRed)"/>
    <text x="973" y="315" fill="#fff0f4" font-size="23" font-weight="800" letter-spacing="2">ACTUAL TRACE</text>
  </g>

  <!-- Declared graph -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M195 505H297 M411 505H513 M627 505H700" fill="none" stroke="#24c8ff" stroke-width="7" marker-end="url(#arrowCyan)" filter="url(#glowCyan)"/>
    <g transform="translate(125 437)">
      <rect width="140" height="136" rx="24" fill="#0b2634" stroke="#24c8ff" stroke-width="4"/>
      <circle cx="70" cy="49" r="22" fill="none" stroke="#24c8ff" stroke-width="5"/>
      <path d="M70 16V31 M70 67V82 M37 49H52 M88 49H103" stroke="#24c8ff" stroke-width="5"/>
      <text x="70" y="111" text-anchor="middle" fill="#f0fbff" font-size="23" font-weight="800">SCOPE</text>
    </g>
    <g transform="translate(335 437)">
      <rect width="140" height="136" rx="24" fill="#0b2634" stroke="#24c8ff" stroke-width="4"/>
      <path d="M37 62H103 M50 43H90 M50 81H90" stroke="#24c8ff" stroke-width="6" stroke-linecap="round"/>
      <text x="70" y="111" text-anchor="middle" fill="#f0fbff" font-size="23" font-weight="800">PLAN</text>
    </g>
    <g transform="translate(545 437)">
      <rect width="140" height="136" rx="24" fill="#0b2634" stroke="#24c8ff" stroke-width="4"/>
      <path d="M39 58L59 78L103 35" fill="none" stroke="#24c8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="111" text-anchor="middle" fill="#f0fbff" font-size="23" font-weight="800">VERIFY</text>
    </g>
    <g transform="translate(688 437)">
      <rect width="68" height="136" rx="24" fill="#17301f" stroke="#f7a51a" stroke-width="4"/>
      <path d="M20 60L31 72L51 42" fill="none" stroke="#f7a51a" stroke-width="7" stroke-linecap="round"/>
      <text x="34" y="111" text-anchor="middle" fill="#fff3d6" font-size="16" font-weight="800" transform="rotate(-90 34 111)">SHIP</text>
    </g>
    <text x="421" y="644" text-anchor="middle" fill="#77dfff" font-size="21" font-weight="700" letter-spacing="2">EVERY EDGE DECLARED · EVERY CHECK PRESENT</text>
  </g>

  <!-- Actual trace -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M1025 505H1127 M1241 505H1343 M1457 505H1530" fill="none" stroke="#7b4352" stroke-width="4" stroke-dasharray="12 12" opacity="0.78" marker-end="url(#arrowRed)"/>
    <g transform="translate(955 437)">
      <rect width="140" height="136" rx="24" fill="#29121a" stroke="#ff315d" stroke-width="4"/>
      <circle cx="70" cy="49" r="22" fill="none" stroke="#ff315d" stroke-width="5"/>
      <path d="M70 16V31 M70 67V82 M37 49H52 M88 49H103" stroke="#ff315d" stroke-width="5"/>
      <text x="70" y="111" text-anchor="middle" fill="#fff0f4" font-size="23" font-weight="800">SCOPE</text>
    </g>
    <g transform="translate(1165 437)">
      <rect width="140" height="136" rx="24" fill="#29121a" stroke="#ff315d" stroke-width="4"/>
      <path d="M37 62H103 M50 43H90 M50 81H90" stroke="#ff315d" stroke-width="6" stroke-linecap="round"/>
      <text x="70" y="111" text-anchor="middle" fill="#fff0f4" font-size="23" font-weight="800">PLAN</text>
    </g>
    <g transform="translate(1375 437)" opacity="0.48">
      <rect width="140" height="136" rx="24" fill="#101418" stroke="#8f98a0" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M39 58L59 78L103 35" fill="none" stroke="#8f98a0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="111" text-anchor="middle" fill="#c2c8cc" font-size="23" font-weight="800">VERIFY</text>
    </g>
    <g transform="translate(1518 437)">
      <rect width="68" height="136" rx="24" fill="#351315" stroke="#ff7b37" stroke-width="4"/>
      <path d="M20 60L31 72L51 42" fill="none" stroke="#ff7b37" stroke-width="7" stroke-linecap="round"/>
      <text x="34" y="111" text-anchor="middle" fill="#fff0de" font-size="16" font-weight="800" transform="rotate(-90 34 111)">SHIP</text>
    </g>

    <path d="M1297 464 C1360 354 1490 362 1536 441" fill="none" stroke="#ff315d" stroke-width="10" marker-end="url(#arrowRed)" filter="url(#glowRed)"/>
    <rect x="1274" y="348" width="302" height="51" rx="25" fill="#4a1021" stroke="#ff315d" stroke-width="2"/>
    <text x="1425" y="381" text-anchor="middle" fill="#fff2f5" font-size="21" font-weight="900" letter-spacing="1.5">UNDECLARED TRANSITION</text>
    <circle cx="1445" cy="505" r="59" fill="none" stroke="#ff315d" stroke-width="6" filter="url(#glowRed)"/>
    <path d="M1407 467L1483 543 M1483 467L1407 543" stroke="#ff315d" stroke-width="10" stroke-linecap="round"/>
    <rect x="1321" y="607" width="248" height="45" rx="22" fill="#3c101d" stroke="#ff315d" stroke-width="2"/>
    <text x="1445" y="637" text-anchor="middle" fill="#fff0f4" font-size="20" font-weight="900" letter-spacing="2">SKIPPED VERIFIER</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="62" y="786" width="1548" height="92" rx="18" fill="#070d12" stroke="#33434d" stroke-width="2"/>
    <line x1="96" y1="832" x2="178" y2="832" stroke="#24c8ff" stroke-width="7"/>
    <text x="197" y="840" fill="#d9f6ff" font-size="21" font-weight="800" letter-spacing="1.5">DECLARED PATH</text>
    <line x1="427" y1="832" x2="509" y2="832" stroke="#ff315d" stroke-width="7"/>
    <text x="528" y="840" fill="#ffe5eb" font-size="21" font-weight="800" letter-spacing="1.5">OBSERVED PATH</text>
    <text x="1548" y="840" text-anchor="end" fill="#f1f5f6" font-size="28" font-weight="900" letter-spacing="2">CHECK THE TRACE, NOT THE DIAGRAM.</text>
  </g>

  <text x="62" y="905" fill="#6f8794" font-family="Segoe UI, Arial, sans-serif" font-size="19" letter-spacing="3">GRAPH CONFORMANCE · ONE REAL RUN · EXPLICIT EVIDENCE</text>
  <text x="1610" y="905" text-anchor="end" fill="#8a9095" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">GraphCheck · MADRE</text>
</svg>
