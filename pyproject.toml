[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcheck"
version = "0.1.0"
description = "Compare a declared agent graph with an explicit execution trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
graphcheck = "graphcheck.__main__:main"

[tool.setuptools]
packages = ["graphcheck"]
